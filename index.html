<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Sumador</title>
  </head>
  <body>
    <h1>Sumador</h1>
    <form id="sumar-form">
      <label for="primer-numero">Primer número:</label>
      <input type="number" id="primer-numero" />
      <label for="segundo-numero">Segundo número:</label>
      <input type="number" id="segundo-numero" />
      <input type="submit" value="Sumar" id="sumar-button" />
    </form>
    <div id="resultado-div"></div>
    <h1>FizzBuzz</h1>
    <form id="fizzbuzz-form">
      <label for="num_fizzbuzz">Número:</label>
      <input type="number" id="num_fizzbuzz" required />
      <button type="submit" id="fizzbuzz-button">Comprobar</button>
    </form>
    <p id="fizzbuzz"></p>
    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
